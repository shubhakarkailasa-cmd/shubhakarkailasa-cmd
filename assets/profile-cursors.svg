<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Shubhakar's profile being built by three collaborating cursors</title>
<desc id="desc">A neon midnight creative studio. Three named cursors move from a shared avatar, to the profile introduction, then to project cards, with each edit appearing in a live profile preview.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080916"/><stop offset=".52" stop-color="#11132c"/><stop offset="1" stop-color="#071d28"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb4dff"/><stop offset=".52" stop-color="#8d5cff"/><stop offset="1" stop-color="#26e6ff"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#191b37"/><stop offset="1" stop-color="#101426"/></linearGradient>
  <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c36e8"/><stop offset=".5" stop-color="#d83ce8"/><stop offset="1" stop-color="#1bbdde"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7c83c9" stroke-opacity=".08" stroke-width="1"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#000" flood-opacity=".48"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <style>
    .cursor{opacity:0}.maya{animation:appear 18s ease-in-out infinite}.leo{animation:appear 18s ease-in-out 1.1s infinite}.jules{animation:appear 18s ease-in-out 2.2s infinite}
    .maya-path{animation:maya 18s cubic-bezier(.45,0,.2,1) infinite}.leo-path{animation:leo 18s cubic-bezier(.45,0,.2,1) infinite}.jules-path{animation:jules 18s cubic-bezier(.45,0,.2,1) infinite}
    .maya-label{animation:ml 18s steps(1,end) infinite}.leo-label{animation:ll 18s steps(1,end) infinite}.jules-label{animation:jl 18s steps(1,end) infinite}
    .appear-maya{animation:am 18s steps(1,end) infinite}.appear-leo{animation:al 18s steps(1,end) infinite}.appear-jules{animation:aj 18s steps(1,end) infinite}
    .typing{animation:blink .8s step-end infinite}.pulse{animation:pulse 2.5s ease-in-out infinite}.spark{animation:spark 2s ease-in-out infinite alternate}
    @keyframes appear{0%,2%,95%,100%{opacity:0}4%,91%{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{50%{opacity:.55;transform:scale(1.035)}}
    @keyframes spark{to{opacity:.25;transform:translateY(-5px)}}
    @keyframes am{0%,13%{opacity:0}14%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes al{0%,38%{opacity:0}39%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes aj{0%,65%{opacity:0}66%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes ml{0%,4%{opacity:0}5%,32%{opacity:1}33%,100%{opacity:0}}
    @keyframes ll{0%,35%{opacity:0}36%,62%{opacity:1}63%,100%{opacity:0}}
    @keyframes jl{0%,64%{opacity:0}65%,91%{opacity:1}92%,100%{opacity:0}}
    @keyframes maya{0%,4%{transform:translate(1040px,220px)}10%{transform:translate(976px,244px)}15%{transform:translate(911px,267px)}20%{transform:translate(930px,277px)}25%{transform:translate(755px,266px)}32%,100%{transform:translate(755px,266px)}}
    @keyframes leo{0%,31%{transform:translate(1040px,550px)}37%{transform:translate(870px,467px)}43%{transform:translate(659px,406px)}49%{transform:translate(554px,399px)}54%{transform:translate(585px,414px)}61%,100%{transform:translate(585px,414px)}}
    @keyframes jules{0%,60%{transform:translate(1040px,560px)}66%{transform:translate(832px,495px)}72%{transform:translate(701px,476px)}78%{transform:translate(740px,491px)}85%{transform:translate(918px,500px)}91%,100%{transform:translate(918px,500px)}}
    @media(prefers-reduced-motion:reduce){.cursor,.maya-path,.leo-path,.jules-path,.maya-label,.leo-label,.jules-label,.appear-maya,.appear-leo,.appear-jules,.pulse,.spark{animation-duration:60s}}
  </style>
</defs>
<rect width="1200" height="680" rx="30" fill="url(#bg)"/><rect width="1200" height="680" rx="30" fill="url(#grid)"/>
<circle cx="108" cy="180" r="145" fill="#9d38ff" opacity=".17" filter="url(#soft)"/><circle cx="1100" cy="560" r="160" fill="#00d9ff" opacity=".13" filter="url(#soft)"/>
<circle class="spark" cx="82" cy="109" r="2" fill="#e682ff"/><circle class="spark" cx="1125" cy="145" r="2.5" fill="#48e7ff"/><circle class="spark" cx="1100" cy="350" r="2" fill="#d68cff"/>
<text x="52" y="52" fill="#8f98c8" font-family="ui-monospace,monospace" font-size="12" letter-spacing="3">COPILOT STUDIO  /  LIVE SESSION</text>
<text x="52" y="88" fill="#f2f1ff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">A profile, built in real time.</text>
<rect x="914" y="42" width="234" height="28" rx="14" fill="#122d32" stroke="#1c756e"/><circle cx="932" cy="56" r="4" fill="#39f0b5" filter="url(#glow)"/><text x="945" y="60" fill="#77f5ca" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1">3 CURSORS CONNECTED</text>
