<rect x="70" y="258" width="480" height="88" rx="10" fill="#111528" stroke="#282d51"/><text x="88" y="282" fill="#787fa7" font-family="ui-monospace,monospace" font-size="10">05  ## About me</text><text x="110" y="307" fill="#c7c9e2" font-family="ui-monospace,monospace" font-size="12">I turn ideas into useful little things.</text><text x="110" y="329" fill="#c7c9e2" font-family="ui-monospace,monospace" font-size="12">Python, images &amp; automation.</text><rect class="typing" x="378" y="317" width="7" height="15" rx="1" fill="#df65ff"/>
