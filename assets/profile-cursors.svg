<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Three cursors collaboratively building Shubhakar's GitHub profile</title>
  <desc id="desc">A warm cream and coral workspace shows three collaborators moving naturally through an editor: one sets the profile avatar, one writes the introduction, and one adds project cards. Their edits appear on a live profile preview.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5e9"/><stop offset=".52" stop-color="#fce8df"/><stop offset="1" stop-color="#e9e9ff"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff745e"/><stop offset=".55" stop-color="#e94872"/><stop offset="1" stop-color="#8959d9"/></linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff725e"/><stop offset="1" stop-color="#e34c85"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#55445f" flood-opacity=".16"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <style>
      .cursor { opacity:0; animation: show 16s ease-in-out infinite; }
      .cursor-a { animation-delay:0s; } .cursor-b { animation-delay:1.6s; } .cursor-c { animation-delay:3.2s; }
      .route-a { animation: routeA 16s cubic-bezier(.45,0,.2,1) infinite; }
      .route-b { animation: routeB 16s cubic-bezier(.45,0,.2,1) infinite; }
      .route-c { animation: routeC 16s cubic-bezier(.45,0,.2,1) infinite; }
      .typing-a { animation: typeA 16s steps(1,end) infinite; }
      .typing-b { animation: typeB 16s steps(1,end) infinite; }
      .typing-c { animation: typeC 16s steps(1,end) infinite; }
      .click-a { animation: clickA 16s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      .click-b { animation: clickB 16s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      .click-c { animation: clickC 16s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      .caret-a { animation: blink .8s step-end infinite; }
      @keyframes show { 0%,3%,94%,100% {opacity:0} 5%,89% {opacity:1} }
      @keyframes blink { 50% {opacity:0} }
      @keyframes routeA { 0%,5%{transform:translate(1040px,204px)} 12%{transform:translate(966px,244px)} 17%{transform:translate(900px,258px)} 22%{transform:translate(934px,266px)} 28%{transform:translate(813px,249px)} 35%,100%{transform:translate(813px,249px)} }
      @keyframes routeB { 0%,18%{transform:translate(1043px,510px)} 25%{transform:translate(829px,379px)} 32%{transform:translate(578px,341px)} 39%{transform:translate(508px,342px)} 48%{transform:translate(535px,371px)} 57%{transform:translate(675px,342px)} 65%,100%{transform:translate(675px,342px)} }
      @keyframes routeC { 0%,39%{transform:translate(1044px,517px)} 47%{transform:translate(598px,445px)} 54%{transform:translate(486px,446px)} 63%{transform:translate(737px,452px)} 72%{transform:translate(639px,452px)} 82%{transform:translate(734px,490px)} 90%,100%{transform:translate(734px,490px)} }
      @keyframes typeA { 0%,13%{opacity:0} 14%,91%{opacity:1} 95%,100%{opacity:0} }
      @keyframes typeB { 0%,35%{opacity:0} 36%,91%{opacity:1} 95%,100%{opacity:0} }
      @keyframes typeC { 0%,61%{opacity:0} 62%,91%{opacity:1} 95%,100%{opacity:0} }
      @keyframes clickA { 0%,16%,100%{opacity:0;transform:scale(.3)} 17%{opacity:.8;transform:scale(1.4)} 21%{opacity:0;transform:scale(2.1)} }
      @keyframes clickB { 0%,44%,100%{opacity:0;transform:scale(.3)} 45%{opacity:.8;transform:scale(1.4)} 49%{opacity:0;transform:scale(2.1)} }
      @keyframes clickC { 0%,71%,100%{opacity:0;transform:scale(.3)} 72%{opacity:.8;transform:scale(1.4)} 76%{opacity:0;transform:scale(2.1)} }
      @media (prefers-reduced-motion: reduce) { .cursor,.route-a,.route-b,.route-c,.typing-a,.typing-b,.typing-c,.click-a,.click-b,.click-c { animation-duration:60s } }
    </style>
  </defs>
  <rect width="1200" height="650" rx="34" fill="url(#canvas)"/>
  <circle cx="85" cy="115" r="120" fill="#ffb99b" opacity=".35" filter="url(#soft)"/>
  <circle cx="1100" cy="540" r="145" fill="#aaa0fa" opacity=".32" filter="url(#soft)"/>
  <text x="54" y="52" fill="#3e344e" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">A LITTLE TEAMWORK, A LOT OF PERSONALITY</text>
  <text x="54" y="88" fill="#211c2b" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">Three cursors. One profile. Made together.</text>
  <g filter="url(#shadow)">
    <rect x="48" y="119" width="520" height="478" rx="20" fill="#fffdfa"/>
    <rect x="48" y="119" width="520" height="48" rx="20" fill="#292538"/>
    <path d="M48 147v20h520v-20" fill="#292538"/>
    <circle cx="72" cy="143" r="5" fill="#ff756b"/><circle cx="90" cy="143" r="5" fill="#f8c45b"/><circle cx="108" cy="143" r="5" fill="#70c99a"/>
    <text x="308" y="148" text-anchor="middle" fill="#e9e3f3" font-family="ui-monospace,monospace" font-size="12">profile/README.md — collaborative edit</text>
    <rect x="66" y="184" width="484" height="50" rx="10" fill="#f6f1f8"/>
    <text x="84" y="205" fill="#95869f" font-family="ui-monospace,monospace" font-size="11">01  # </text><text x="128" y="205" fill="#65489b" font-family="ui-monospace,monospace" font-size="13" font-weight="700">Hi, I'm Shubhakar Kailasa</text>
    <text x="84" y="222" fill="#a198a8" font-family="ui-monospace,monospace" font-size="10">Python developer • automation • image processing</text>
    <rect x="66" y="246" width="484" height="118" rx="11" fill="#fff" stroke="#e9e1eb"/>
    <text x="84" y="268" fill="#9d92a4" font-family="ui-monospace,monospace" font-size="10">02  ## About me</text>
    <text x="105" y="293" fill="#51475c" font-family="ui-monospace,monospace" font-size="12">I build useful things with Python,</text>
    <text x="105" y="313" fill="#51475c" font-family="ui-monospace,monospace" font-size="12">OpenCV and curious experiments.</text>
    <text x="105" y="343" fill="#d48a27" font-family="ui-monospace,monospace" font-size="11">Currently making ideas real.</text>
    <rect x="66" y="376" width="484" height="158" rx="11" fill="#fff" stroke="#e9e1eb"/>
    <text x="84" y="399" fill="#9d92a4" font-family="ui-monospace,monospace" font-size="10">03  ## Selected projects</text>
    <rect x="84" y="415" width="205" height="44" rx="8" fill="#fff5ef" stroke="#f3d9cf"/><circle cx="101" cy="437" r="5" fill="#ed745f"/><text x="114" y="434" fill="#51475c" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">OpenCV Mini Image Editor</text><text x="114" y="448" fill="#988b9c" font-family="Inter,Arial,sans-serif" font-size="9">Image tools, made by hand</text>
    <rect x="302" y="415" width="230" height="44" rx="8" fill="#f3f0ff" stroke="#ded7f5"/><circle cx="319" cy="437" r="5" fill="#8970dc"/><text x="332" y="434" fill="#51475c" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">Automation Drawing Bot</text><text x="332" y="448" fill="#988b9c" font-family="Inter,Arial,sans-serif" font-size="9">Making the mouse do the work</text>
    <rect x="84" y="472" width="205" height="44" rx="8" fill="#f0f8f5" stroke="#d5ebe1"/><circle cx="101" cy="494" r="5" fill="#52a982"/><text x="114" y="491" fill="#51475c" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">ISS Live Tracker</text><text x="114" y="505" fill="#988b9c" font-family="Inter,Arial,sans-serif" font-size="9">A live view of our orbiting lab</text>
    <rect x="302" y="472" width="230" height="44" rx="8" fill="#fff8e9" stroke="#f1e4c4"/><circle cx="319" cy="494" r="5" fill="#d6a53c"/><text x="332" y="491" fill="#51475c" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">ATM Mini Project</text><text x="332" y="505" fill="#988b9c" font-family="Inter,Arial,sans-serif" font-size="9">Transactions with a paper trail</text>
    <rect x="66" y="546" width="484" height="34" rx="9" fill="#292538"/>
    <text x="85" y="568" fill="#8fe0b0" font-family="ui-monospace,monospace" font-size="11">✓ changes saved</text><text x="515" y="568" fill="#cfc6d7" font-family="ui-monospace,monospace" font-size="10" text-anchor="end">README.md</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="607" y="119" width="545" height="478" rx="20" fill="#fff"/>
    <path d="M627 119h505a20 20 0 0 1 20 20v40H607v-40a20 20 0 0 1 20-20" fill="#fffdfa"/>
    <circle cx="633" cy="143" r="5" fill="#e5dce9"/><circle cx="651" cy="143" r="5" fill="#e5dce9"/><circle cx="669" cy="143" r="5" fill="#e5dce9"/>
    <rect x="743" y="131" width="320" height="23" rx="11" fill="#f1edf3"/><text x="903" y="147" text-anchor="middle" fill="#93899a" font-family="Arial,sans-serif" font-size="10">github.com / shubhakar-kailasa</text>
    <rect x="607" y="178" width="545" height="150" fill="url(#hero)"/>
    <circle cx="1080" cy="196" r="85" fill="#fff" opacity=".08"/><circle cx="1057" cy="320" r="54" fill="#fff" opacity=".07"/>
    <text x="641" y="211" fill="#fff" opacity=".8" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">HELLO, WORLD</text>
    <text x="641" y="248" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">Building things,</text><text x="641" y="280" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">one idea at a time.</text>
    <circle cx="698" cy="337" r="43" fill="#fff" stroke="#fff" stroke-width="6"/>
    <circle cx="698" cy="337" r="38" fill="#292538"/><text x="698" y="346" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800">SK</text>
    <rect x="641" y="399" width="477" height="54" rx="10" fill="#fff" stroke="#e7e1eb"/>
    <text x="659" y="421" fill="#302a39" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">Shubhakar Kailasa</text><text x="659" y="440" fill="#827889" font-family="Inter,Arial,sans-serif" font-size="11">Python · OpenCV · SQL · VS Code</text>
    <text x="641" y="484" fill="#302a39" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800">Pinned projects</text>
    <rect x="641" y="497" width="225" height="60" rx="9" fill="#fffaf7" stroke="#f0e5e2"/><text x="657" y="520" fill="#55465b" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">opencv-mini-image-editor</text><text x="657" y="540" fill="#a18e9f" font-family="Inter,Arial,sans-serif" font-size="10">Python  ·  image editing</text>
    <rect x="878" y="497" width="240" height="60" rx="9" fill="#f8f6ff" stroke="#e6e1f3"/><text x="894" y="520" fill="#55465b" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">AUTOMATION-DRAWING-BOT</text><text x="894" y="540" fill="#a18e9f" font-family="Inter,Arial,sans-serif" font-size="10">Python  ·  mouse automation</text>
  </g>
  <g class="typing-a"><text x="244" y="218" fill="#d07045" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">MAYA · writing bio</text></g>
  <g class="typing-b"><text x="244" y="218" fill="#7861c8" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">LEO · adding projects</text></g>
  <g class="typing-c"><text x="244" y="218" fill="#258a78" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">JULES · polishing profile</text></g>
  <circle class="click-a" cx="900" cy="258" r="13" fill="none" stroke="#e36b57" stroke-width="3"/>
  <circle class="click-b" cx="508" cy="342" r="13" fill="none" stroke="#7861c8" stroke-width="3"/>
  <circle class="click-c" cx="734" cy="490" r="13" fill="none" stroke="#258a78" stroke-width="3"/>
  <g class="cursor cursor-a"><g class="route-a"><path d="M0 0L1 26L8 19L14 32L20 29L14 16L25 16Z" fill="#e36b57" stroke="#fff" stroke-width="2"/><rect x="20" y="-7" width="65" height="20" rx="9" fill="#e36b57"/><text x="52" y="7" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="9" font-weight="700">MAYA</text></g></g>
  <g class="cursor cursor-b"><g class="route-b"><path d="M0 0L1 26L8 19L14 32L20 29L14 16L25 16Z" fill="#7861c8" stroke="#fff" stroke-width="2"/><rect x="20" y="-7" width="55" height="20" rx="9" fill="#7861c8"/><text x="47" y="7" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="9" font-weight="700">LEO</text></g></g>
  <g class="cursor cursor-c"><g class="route-c"><path d="M0 0L1 26L8 19L14 32L20 29L14 16L25 16Z" fill="#258a78" stroke="#fff" stroke-width="2"/><rect x="20" y="-7" width="60" height="20" rx="9" fill="#258a78"/><text x="50" y="7" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="9" font-weight="700">JULES</text></g></g>
  <text x="600" y="630" text-anchor="middle" fill="#776b80" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1">THOUGHTFUL DETAILS · REAL PROJECTS · BUILT TOGETHER</text>
</svg>
