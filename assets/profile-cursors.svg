<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Shubhakar's profile, built by multiple animated cursors</title>
  <desc id="desc">A colorful gradient workspace where three animated cursors collaborate to build a developer profile card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10102b"/><stop offset=".52" stop-color="#24215c"/><stop offset="1" stop-color="#092f4f"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c5cff"/><stop offset="1" stop-color="#19d3e6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .cursor { animation: roam 7s ease-in-out infinite alternate; }
      .c2 { animation-delay: -2.2s; }
      .c3 { animation-delay: -4.5s; }
      .line { opacity: 0; animation: appear 7s steps(1,end) infinite; }
      .l1 { animation-delay: .4s; } .l2 { animation-delay: 1.4s; } .l3 { animation-delay: 2.4s; } .l4 { animation-delay: 3.4s; }
      .blink { animation: blink 1s steps(2,start) infinite; }
      @keyframes roam { 0% { transform: translate(0,0) } 25% { transform: translate(175px,48px) } 55% { transform: translate(380px,5px) } 80% { transform: translate(210px,125px) } 100% { transform: translate(440px,92px) } }
      @keyframes appear { 0%,8% { opacity: 0 } 12%,88% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes blink { to { opacity: 0 } }
    </style>
  </defs>
  <rect width="1000" height="470" rx="28" fill="url(#bg)"/>
  <circle cx="105" cy="70" r="100" fill="#7c5cff" opacity=".13"/><circle cx="895" cy="410" r="155" fill="#19d3e6" opacity=".12"/>
  <text x="500" y="50" fill="#c9d5ff" font-family="ui-monospace,monospace" font-size="15" text-anchor="middle" letter-spacing="3">COLLABORATIVE PROFILE BUILD IN PROGRESS</text>
  <rect x="160" y="85" width="680" height="320" rx="19" fill="#0c1022" stroke="#6577be" stroke-width="2"/>
  <path d="M160 124h680" stroke="#303957" stroke-width="2"/>
  <circle cx="185" cy="105" r="6" fill="#ff6685"/><circle cx="207" cy="105" r="6" fill="#ffce5c"/><circle cx="229" cy="105" r="6" fill="#5ee6a8"/>
  <text x="500" y="111" fill="#93a2d0" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">profile.md — team edit</text>
  <rect x="190" y="151" width="620" height="218" rx="12" fill="#151b32" stroke="#263456"/>
  <circle cx="242" cy="205" r="29" fill="url(#shine)" opacity=".95"/>
  <text x="242" y="211" fill="#fff" font-family="ui-monospace,monospace" font-size="18" font-weight="bold" text-anchor="middle">SK</text>
  <text x="290" y="198" fill="#fff" font-family="ui-monospace,monospace" font-size="22" font-weight="bold">Shubhakar Kailasa</text>
  <text x="290" y="221" fill="#9ba9d5" font-family="ui-monospace,monospace" font-size="13">Python • OpenCV • SQL • VS Code</text>
  <path d="M215 245h570" stroke="#2b3656"/>
  <text x="220" y="274" fill="#bd8cff" font-family="ui-monospace,monospace" font-size="14">&gt; </text>
  <text class="line l1" x="245" y="274" fill="#c9d5ff" font-family="ui-monospace,monospace" font-size="14">Building useful things with code...</text>
  <text x="220" y="305" fill="#68e1d4" font-family="ui-monospace,monospace" font-size="14">&gt; </text>
  <text class="line l2" x="245" y="305" fill="#c9d5ff" font-family="ui-monospace,monospace" font-size="14">Automation, image tools &amp; experiments</text>
  <text x="220" y="336" fill="#ff86b7" font-family="ui-monospace,monospace" font-size="14">&gt; </text>
  <text class="line l3" x="245" y="336" fill="#c9d5ff" font-family="ui-monospace,monospace" font-size="14">Several cursors, one profile ✨</text>
  <rect class="blink" x="480" y="324" width="8" height="16" rx="2" fill="#62e6dc"/>
  <g class="cursor" filter="url(#glow)"><path d="M0 0L0 27L8 20L14 33L20 30L14 17L25 16Z" fill="#ff6685" stroke="#fff" stroke-width="1.5"/><rect x="20" y="-3" width="66" height="20" rx="9" fill="#ff6685"/><text x="53" y="11" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="10">CURSOR 1</text></g>
  <g class="cursor c2" filter="url(#glow)"><path d="M0 0L0 27L8 20L14 33L20 30L14 17L25 16Z" fill="#24d9d0" stroke="#fff" stroke-width="1.5"/><rect x="20" y="-3" width="66" height="20" rx="9" fill="#24d9d0"/><text x="53" y="11" fill="#102134" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="10">CURSOR 2</text></g>
  <g class="cursor c3" filter="url(#glow)"><path d="M0 0L0 27L8 20L14 33L20 30L14 17L25 16Z" fill="#b78aff" stroke="#fff" stroke-width="1.5"/><rect x="20" y="-3" width="66" height="20" rx="9" fill="#b78aff"/><text x="53" y="11" fill="#201339" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="10">CURSOR 3</text></g>
  <text x="500" y="445" fill="#aab8e7" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">DESIGNING • TYPING • CREATING — TOGETHER</text>
</svg>
