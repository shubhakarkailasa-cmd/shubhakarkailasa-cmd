<rect x="88" y="470" width="210" height="54" rx="8" fill="#142821" stroke="#246250"/><circle cx="105" cy="489" r="4" fill="#43e7a3"/><text x="118" y="492" fill="#d8ffeb" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">ISS Live Tracker</text><text x="118" y="510" fill="#83a997" font-family="Inter,Arial,sans-serif" font-size="9">watch the station in orbit</text>
<rect x="312" y="470" width="220" height="54" rx="8" fill="#292318" stroke="#70562a"/><circle cx="329" cy="489" r="4" fill="#ffca5c"/><text x="342" y="492" fill="#fff1ce" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">ATM Mini Project</text><text x="342" y="510" fill="#b2a078" font-family="Inter,Arial,sans-serif" font-size="9">transactions, neatly tracked</text>
